services:
  redis:
    image: redis:8.10-alpine
    restart: unless-stopped
    command:
      - redis-server
      - /usr/local/etc/redis/redis.conf
      - --requirepass
      - "${REDIS_PASSWORD:?Set REDIS_PASSWORD in the environment or env file}"
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:?Set REDIS_PASSWORD in the environment or env file}"
    volumes:
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis_data:/data
    mem_limit: 512m
    cpus: 0.5
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -qx PONG']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the environment or env file}"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - bugraaydingoz-web
      - myanaesthesie-web
      - robofleet-web
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  bugraaydingoz-web:
    build:
      context: ..
      dockerfile: infra/bugraaydingoz-web.Dockerfile
    restart: unless-stopped
    expose:
      - "3000"

  myanaesthesie-web:
    build:
      context: ..
      dockerfile: infra/myanaesthesie-web.Dockerfile
    restart: unless-stopped
    expose:
      - "3000"

  robofleet-web:
    build:
      context: ..
      dockerfile: infra/robofleet-web.Dockerfile
    restart: unless-stopped
    depends_on:
      robofleet-api:
        condition: service_healthy
    expose:
      - "3000"

  robofleet-api:
    build:
      context: ..
      dockerfile: infra/robofleet-api.Dockerfile
    restart: unless-stopped
    depends_on:
      robofleet-migrate:
        condition: service_completed_successfully
    environment:
      PORT: "3000"
      DATABASE_URL: postgresql://postgres@postgres:5432/robofleet
      PGPASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the environment or env file}"
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "--input-type=module",
          "-e",
          "const r = await fetch('http://127.0.0.1:3000/api/ready'); process.exit(r.ok ? 0 : 1)",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  robofleet-migrate:
    build:
      context: ..
      dockerfile: infra/robofleet-api.Dockerfile
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres@postgres:5432/robofleet
      PGPASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the environment or env file}"
    command: ["node", "apps/robofleet-api/dist/migrate.js"]

volumes:
  redis_data:
  postgres_data:
  caddy_data:
  caddy_config:
